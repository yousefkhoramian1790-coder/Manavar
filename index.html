
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANAVAR | بازار خرید و فروش</title>
<style>
:root {
  --blue:#1264e8;
  --dark:#172033;
  --muted:#697386;
  --line:#e7ebf2;
  --bg:#f5f7fb;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--dark);
}
header {
  background:white;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:5;
}
.wrap {
  max-width:1080px;
  margin:auto;
  padding:16px;
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.logo {
  font-size:26px;
  font-weight:900;
  color:var(--blue);
}
button {
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
}
.primary {background:var(--blue);color:white}
.secondary {background:#eef4ff;color:var(--blue)}
.hero {
  background:linear-gradient(130deg,#0b3d91,#1976f3);
  color:white;
  padding:34px 20px;
  border-radius:22px;
  margin:22px 0;
}
.hero h1 {margin:0 0 10px;font-size:28px}
.search {
  display:flex;
  gap:8px;
  background:white;
  padding:7px;
  border-radius:14px;
}
.search input {
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:10px;
  font:inherit;
}
h2 {font-size:20px;margin:28px 0 14px}
.cats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.cat {
  background:white;
  border:1px solid var(--line);
  padding:16px 8px;
  border-radius:14px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}
.cat span {display:block;font-size:27px;margin-bottom:6px}
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}
.pic {
  height:145px;
  display:grid;
  place-items:center;
  background:#edf3ff;
  font-size:55px;
}
.info {padding:14px}
.info h3 {font-size:15px;margin:0 0 10px}
.price {font-weight:900;color:var(--blue)}
.city {font-size:12px;color:var(--muted);margin-top:8px}
.empty {
  background:white;
  padding:25px;
  text-align:center;
  border-radius:14px;
  grid-column:1/-1;
}
footer {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:30px;
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:#0b122acc;
  z-index:10;
  padding:18px;
  align-items:center;
  justify-content:center;
}
.modal.open {display:flex}
.panel {
  background:white;
  border-radius:18px;
  padding:20px;
  width:min(100%,440px);
  max-height:90vh;
  overflow:auto;
}
.panel input,.panel select,.panel textarea {
  width:100%;
  padding:12px;
  margin:7px 0 13px;
  border:1px solid var(--line);
  border-radius:10px;
  font:inherit;
}
.detail-icon {
  background:#edf3ff;
  border-radius:15px;
  padding:35px;
  text-align:center;
  font-size:75px;
}
.detail-price {
  font-size:22px;
  color:var(--blue);
  font-weight:bold;
}
@media(max-width:650px) {
  .grid {grid-template-columns:repeat(2,1fr)}
  .cats {grid-template-columns:repeat(2,1fr)}
  .hero h1 {font-size:23px}
}
</style>
</head>
<body>

<header>
<div class="wrap top">
<div class="logo">MANAVAR</div>
<button class="primary" onclick="openForm()">＋ ثبت آگهی</button>
</div>
</header>

<main class="wrap">
<section class="hero">
<h1>هر چیزی که می‌خوای، اینجاست!</h1>
<p>خرید و فروش آسان، سریع و مطمئن در ماناور</p>
<div class="search">
<input id="q" placeholder="جست‌وجوی کالا..." oninput="render()">
<button class="primary" onclick="render()">جست‌وجو</button>
</div>
</section>

<h2>دسته‌بندی‌ها</h2>
<div class="cats">
<div class="cat" onclick="choose('موبایل')"><span>📱</span>موبایل</div>
<div class="cat" onclick="choose('کنسول و بازی')"><span>🎮</span>کنسول و بازی</div>
<div class="cat" onclick="choose('خانه')"><span>🛋️</span>خانه</div>
<div class="cat" onclick="choose('ورزشی')"><span>⚽</span>ورزشی</div>
</div>

<div class="top">
<h2 id="sectionTitle">آگهی‌های تازه</h2>
<button class="secondary" onclick="choose('')">همه آگهی‌ها</button>
</div>
<div id="listings" class="grid"></div>

<footer>MANAVAR · بازار آنلاین خرید و فروش</footer>
</main>

<div class="modal" id="formModal">
<div class="panel">
<div class="top">
<h2>ثبت آگهی</h2>
<button class="secondary" onclick="closeForm()">✕</button>
</div>
<label>عنوان آگهی</label>
<input id="title" placeholder="نام کالا">
<label>قیمت (تومان)</label>
<input id="price" type="number" placeholder="قیمت">
<label>دسته‌بندی</label>
<select id="category">
<option>موبایل</option>
<option>کنسول و بازی</option>
<option>خانه</option>
<option>ورزشی</option>
<option>سایر</option>
</select>
<label>شهر</label>
<input id="city" placeholder="شهر">
<label>توضیحات</label>
<textarea id="description" placeholder="توضیحات کالا"></textarea>
<button class="primary" style="width:100%" onclick="addListing()">ثبت آگهی</button>
</div>
</div>

<div class="modal" id="detailModal">
<div class="panel">
<div class="top">
<h2>جزئیات آگهی</h2>
<button class="secondary" onclick="closeDetail()">✕</button>
</div>
<div class="detail-icon" id="detailIcon"></div>
<h2 id="detailTitle"></h2>
<div class="detail-price" id="detailPrice"></div>
<p id="detailCategory"></p>
<p id="detailCity"></p>
<p id="detailDescription"></p>
<button class="primary" style="width:100%" onclick="closeDetail()">بازگشت</button>
</div>
</div>

<script>
const data = [
{title:"گوشی هوشمند تمیز",price:"۱۸٬۵۰۰٬۰۰۰",cat:"موبایل",city:"تهران",icon:"📱",description:"گوشی هوشمند در وضعیت مناسب."},
{title:"دسته بازی PS5",price:"۲٬۸۰۰٬۰۰۰",cat:"کنسول و بازی",city:"کرج",icon:"🎮",description:"دسته بازی پلی‌استیشن ۵."},
{title:"دوچرخه شهری",price:"۴٬۲۰۰٬۰۰۰",cat:"ورزشی",city:"تهران",icon:"🚲",description:"دوچرخه مناسب استفاده شهری."},
{title:"صندلی راحتی",price:"۳٬۰۰۰٬۰۰۰",cat:"خانه",city:"اصفهان",icon:"🪑",description:"صندلی راحتی."},
{title:"بازی کنسول",price:"۱٬۲۰۰٬۰۰۰",cat:"کنسول و بازی",city:"شیراز",icon:"🕹️",description:"بازی مخصوص کنسول."},
{title:"توپ فوتبال",price:"۶۵۰٬۰۰۰",cat:"ورزشی",city:"تبریز",icon:"⚽",description:"توپ فوتبال."}
];

let active = "";

function render() {
const q = document.getElementById("q").value.trim();
const items = data.filter(x =>
(!active || x.cat === active) &&
(!q || (x.title+x.cat+x.city).includes(q))
);
const list = document.getElementById("listings");

if(!items.length) {
list.innerHTML='<div class="empty">آگهی‌ای پیدا نشد.</div>';
return;
}

list.innerHTML=items.map(x=>{
const index=data.indexOf(x);
return `
<article class="card" onclick="openDetail(${index})">
<div class="pic">${x.icon}</div>
<div class="info">
<h3>${escapeHTML(x.title)}</h3>
<div class="price">${escapeHTML(x.price)} تومان</div>
<div class="city">${escapeHTML(x.city)} · ${escapeHTML(x.cat)}</div>
</div>
</article>`;
}).join("");
}

function escapeHTML(value) {
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function choose(category) {
active=category;
document.getElementById("sectionTitle").textContent=
category ? "آگهی‌های "+category : "آگهی‌های تازه";
render();
}

function openDetail(index) {
const item=data[index];
if(!item) return;
document.getElementById("detailIcon").textContent=item.icon;
document.getElementById("detailTitle").textContent=item.title;
document.getElementById("detailPrice").textContent=item.price+" تومان";
document.getElementById("detailCategory").textContent="دسته‌بندی: "+item.cat;
document.getElementById("detailCity").textContent="شهر: "+item.city;
document.getElementById("detailDescription").textContent="توضیحات: "+item.description;
document.getElementById("detailModal").classList.add("open");
}

function closeDetail() {
document.getElementById("detailModal").classList.remove("open");
}

function openForm() {
document.getElementById("formModal").classList.add("open");
}

function closeForm() {
document.getElementById("formModal").classList.remove("open");
}

function addListing() {
const title=document.getElementById("title").value.trim();
const price=document.getElementById("price").value;
const cat=document.getElementById("category").value;
const city=document.getElementById("city").value.trim()||"نامشخص";
const description=document.getElementById("description").value.trim();
if(!title || !price || Number(price)<=0) {
alert("عنوان و قیمت معتبر را وارد کن.");
return;
}
const icons={"موبایل":"📱","کنسول و بازی":"🎮","خانه":"🛋️","ورزشی":"⚽","سایر":"📦"};
data.unshift({
title,price:Number(price).toLocaleString("fa-IR"),
cat,city,icon:icons[cat],description
});
active="";
document.getElementById("q").value="";
document.getElementById("sectionTitle").textContent="آگهی‌های تازه";
render();
closeForm();
document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("city").value="";
document.getElementById("description").value="";
alert("آگهی آزمایشی ثبت شد.");
}

render();
</script>
</body>
</html>
